<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bullet Generator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sand:        #F7F4EC;
  --terra:       #D69C8C;
  --sage:        #131210;
  --golden:      #F0C9BA;
  --near-black:  #131210;
  --brown:       #6B6558;
  --white:       #FFFFFF;
  --border:      2px solid #131210;
  --shadow-black: 4px 4px 0 #131210;
  --shadow-terra: 4px 4px 0 #D69C8C;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--sand);
  color: var(--near-black);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Layout ─────────────────────────────────────────────── */
.wrap {
  position: relative;
  z-index: 1;
  max-width: 800px;
  margin: 0 auto;
  padding: 56px 40px 80px;
}

/* ── Header ─────────────────────────────────────────────── */
header { margin-bottom: 24px; }

h1 {
  font-size: clamp(2rem, 5.5vw, 3rem);
  font-weight: 900;
  letter-spacing: -0.01em;
  line-height: 1.05;
  color: var(--near-black);
}

.subtitle {
  margin-top: 8px;
  font-size: 14px;
  font-weight: 400;
  color: var(--brown);
}

/* ── Input card ─────────────────────────────────────────── */
.input-card {
  background: var(--white);
  border: var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow-black);
  padding: 32px;
  margin-bottom: 24px;
}

textarea {
  display: block;
  width: 100%;
  min-height: 160px;
  padding: 0.75rem;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.65;
  color: var(--near-black);
  background: var(--sand);
  border: var(--border);
  border-radius: 8px;
  resize: vertical;
  outline: none;
  transition: box-shadow 0.15s;
}

textarea:focus { box-shadow: 3px 3px 0 var(--terra); }
textarea::placeholder { color: var(--brown); opacity: 0.6; }

.meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 16px;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.meta-left {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.stats {
  font-size: 12px;
  font-weight: 400;
  color: var(--brown);
  letter-spacing: 0.02em;
}

/* ── Bullet count badge ─────────────────────────────────── */
.bullet-count {
  display: inline-block;
  padding: 0.25rem 0.7rem;
  background: var(--sage);
  color: var(--white);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  border: var(--border);
  border-radius: 99px;
  visibility: hidden;
}

.bullet-count.show { visibility: visible; }

/* ── Clear button ───────────────────────────────────────── */
.clear-btn {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  padding: 0.4rem 1.1rem;
  border: var(--border);
  border-radius: 99px;
  background: var(--terra);
  color: var(--near-black);
  cursor: pointer;
  transition: box-shadow 0.12s, transform 0.1s;
  white-space: nowrap;
}

.clear-btn:hover  { box-shadow: var(--shadow-black); transform: translate(-1px,-1px); }
.clear-btn:active { box-shadow: none; transform: translate(2px,2px); }

/* ── Section row ────────────────────────────────────────── */
.section-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-top: 0;
  margin-bottom: 16px;
}

.sec-tag {
  display: inline-flex;
  align-items: center;
  padding: 0.3rem 0.85rem;
  background: var(--sage);
  color: var(--white);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: var(--border);
  border-radius: 99px;
}

/* ── Output card ────────────────────────────────────────── */
.output-card {
  background: var(--white);
  border: 2.5px solid var(--terra);
  border-radius: 12px;
  box-shadow: var(--shadow-terra);
  padding: 32px;
  transition: transform 0.1s, box-shadow 0.1s;
}

/* ── Card top row ───────────────────────────────────────── */
.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.card-top-left {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

/* ── Style picker ───────────────────────────────────────── */
.style-picker {
  display: flex;
  gap: 4px;
}

.style-btn {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 0.3rem 0.8rem;
  border: var(--border);
  border-radius: 99px;
  background: transparent;
  color: var(--near-black);
  cursor: pointer;
  transition: box-shadow 0.12s, transform 0.1s, background 0.12s;
  white-space: nowrap;
}

.style-btn:hover  { box-shadow: 2px 2px 0 var(--near-black); transform: translate(-1px,-1px); }
.style-btn:active { box-shadow: none; transform: translate(1px,1px); }
.style-btn.active { background: var(--golden); }

/* ── Copy button ────────────────────────────────────────── */
.copy-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.3rem;
  padding: 0.3rem 0.85rem;
  background: var(--golden);
  border: var(--border);
  border-radius: 99px;
  cursor: pointer;
  color: var(--near-black);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  flex-shrink: 0;
  transition: box-shadow 0.12s, transform 0.1s;
  white-space: nowrap;
}

.copy-btn:hover  { box-shadow: 2px 2px 0 var(--near-black); transform: translate(-1px,-1px); }
.copy-btn:active { box-shadow: none; transform: translate(1px,1px); }
.copy-btn.ok     { background: var(--sage); color: var(--white); }
.copy-btn svg    { flex-shrink: 0; }

/* ── Output text ────────────────────────────────────────── */
.card-out {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.85;
  color: var(--near-black);
  white-space: pre-wrap;
  word-break: break-word;
  min-height: 2em;
  user-select: text;
}

.card-out.empty::before {
  content: 'Bullets will appear here…';
  color: var(--brown);
  opacity: 0.45;
  font-weight: 400;
}

/* ── Mobile ─────────────────────────────────────────────── */
@media (max-width: 620px) {
  .wrap { padding: 40px 24px 60px; }
  .card-top { gap: 0.5rem; }
}
</style>

<body>

<div class="wrap">

  <header>
    <h1>Bullet Generator</h1>
    <p class="subtitle">Paste rough notes or a conversation and get clean bullet points instantly.</p>
  </header>

  <!-- Input -->
  <div class="input-card">
    <textarea
      id="input"
      placeholder="Type or paste notes, a conversation, or a wall of text here."
      spellcheck="false"
      autocorrect="off"
      autocapitalize="off"
    ></textarea>
    <div class="meta">
      <div class="meta-left">
        <span class="stats" id="stats">0 words · 0 characters</span>
        <span class="bullet-count" id="badge"></span>
      </div>
      <button class="clear-btn" onclick="clearAll()">Clear</button>
    </div>
  </div>

  <!-- Output section -->
  <div class="section-row">
    <span class="sec-tag">Output</span>
  </div>

  <div class="output-card">
    <div class="card-top">
      <div class="card-top-left">
        <div class="style-picker" role="group" aria-label="Bullet style">
          <button class="style-btn active" data-style="bullet">• Bullet</button>
          <button class="style-btn" data-style="dash">— Dash</button>
          <button class="style-btn" data-style="num">1. Number</button>
        </div>
      </div>
      <button class="copy-btn" id="btn-copy" onclick="copyOut()">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copy
      </button>
    </div>
    <div class="card-out empty" id="output"></div>
  </div>

</div>

<script>
/* ---------------------------------------------------------
   State
--------------------------------------------------------- */
let currentBullets = [];
let currentStyle   = 'bullet';

const PREFIXES = {
  bullet: (b)    => `• ${b}`,
  dash:   (b)    => `— ${b}`,
  num:    (b, i) => `${i + 1}. ${b}`,
};

/* ---------------------------------------------------------
   DOM refs
--------------------------------------------------------- */
const inputEl  = document.getElementById('input');
const outputEl = document.getElementById('output');
const badgeEl  = document.getElementById('badge');
const statsEl  = document.getElementById('stats');
const copyBtn  = document.getElementById('btn-copy');

/* ---------------------------------------------------------
   Events
--------------------------------------------------------- */
inputEl.addEventListener('input', update);
inputEl.addEventListener('paste', () => requestAnimationFrame(update));

document.querySelectorAll('.style-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentStyle = btn.dataset.style;
    renderOutput();
  });
});

/* ---------------------------------------------------------
   Core
--------------------------------------------------------- */
function update() {
  const raw     = inputEl.value;
  const trimmed = raw.trim();
  const words   = trimmed ? trimmed.split(/\s+/).length : 0;
  const chars   = raw.length;
  statsEl.textContent = `${words} ${words === 1 ? 'word' : 'words'} · ${chars} ${chars === 1 ? 'character' : 'characters'}`;

  if (!trimmed) {
    currentBullets = [];
    renderOutput();
    badgeEl.classList.remove('show');
    return;
  }

  currentBullets = textToBullets(raw);
  renderOutput();

  const n = currentBullets.length;
  badgeEl.textContent = `${n} ${n === 1 ? 'bullet' : 'bullets'}`;
  badgeEl.classList.toggle('show', n > 0);
}

function renderOutput() {
  if (!currentBullets.length) {
    outputEl.textContent = '';
    outputEl.classList.add('empty');
    return;
  }
  const prefix = PREFIXES[currentStyle];
  outputEl.textContent = currentBullets.map((b, i) => prefix(b, i)).join('\n');
  outputEl.classList.remove('empty');
}

/* ---------------------------------------------------------
   Copy
--------------------------------------------------------- */
function copyOut() {
  const text = outputEl.textContent;
  if (!text || outputEl.classList.contains('empty')) return;

  const done = () => {
    copyBtn.classList.add('ok');
    copyBtn.textContent = '✓ Copied';
    setTimeout(() => {
      copyBtn.classList.remove('ok');
      copyBtn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
    }, 1500);
  };

  navigator.clipboard.writeText(text).then(done).catch(() => {
    const tmp = document.createElement('textarea');
    tmp.value = text;
    tmp.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(tmp);
    tmp.select();
    document.execCommand('copy');
    document.body.removeChild(tmp);
    done();
  });
}

/* ---------------------------------------------------------
   Clear
--------------------------------------------------------- */
function clearAll() {
  inputEl.value    = '';
  currentBullets   = [];
  renderOutput();
  statsEl.textContent = '0 words · 0 characters';
  badgeEl.classList.remove('show');
  inputEl.focus();
}

/* ---------------------------------------------------------
   Bullet engine
--------------------------------------------------------- */
const MIN_LEN = 7;

function textToBullets(raw) {
  let text = raw
    .replace(/\r\n|\r/g, '\n')
    .replace(/[​‌‍﻿­]/g, '')
    .replace(/[ \t]+/g, ' ');

  // Strip "Speaker:" prefixes from chat / transcript text
  text = text.replace(/^[A-Za-z][A-Za-z .'-]{0,28}:\s*/gm, '');

  const paragraphs = text.split(/\n{2,}/);
  const rawItems   = [];

  for (const para of paragraphs) {
    const trimmed = para.trim();
    if (!trimmed) continue;

    const lines      = trimmed.split('\n').map(l => l.trim()).filter(Boolean);
    const listCount  = lines.filter(l => /^[-•*▪◦◆▸►▶‣⁃●]/.test(l) || /^\d+[.)]\s/.test(l)).length;
    const isList     = lines.length > 1 && listCount / lines.length > 0.5;

    if (isList) {
      lines.forEach(l => rawItems.push(stripListMarker(l)));
    } else {
      for (const line of lines) {
        if (line.length <= 100) {
          // "Header: a, b, c" → split on commas
          const colonIdx = line.indexOf(':');
          if (colonIdx > 0 && colonIdx < 50) {
            const after = line.slice(colonIdx + 1).trim();
            const parts = after.split(/,\s+/);
            if (parts.length >= 2 && parts.every(p => p.length < 80 && p.length > 1)) {
              parts.forEach(p => rawItems.push(p.trim()));
              continue;
            }
          }
          rawItems.push(line);
        } else {
          rawItems.push(...splitSentences(line));
        }
      }
    }
  }

  const seen = new Set();
  return rawItems
    .map(cleanBullet)
    .filter(b => {
      if (b.length < MIN_LEN) return false;
      const key = b.toLowerCase().replace(/\s+/g, ' ');
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
}

function stripListMarker(line) {
  return line
    .replace(/^[-•*▪◦◆▸►▶‣⁃●>+]\s*/, '')
    .replace(/^\d+[.)]\s*/, '')
    .trim();
}

function splitSentences(text) {
  const results = [];
  let current   = '';

  for (let i = 0; i < text.length; i++) {
    current += text[i];
    if ('.!?'.includes(text[i]) && i + 1 < text.length) {
      let j = i + 1;
      while (j < text.length && text[j] === ' ') j++;
      if (j >= text.length || /[A-Z"'(]/.test(text[j])) {
        results.push(current.trim());
        current = '';
        i = j - 1;
      }
    } else if (text[i] === ';') {
      results.push(current.trim());
      current = '';
    }
  }
  if (current.trim()) results.push(current.trim());

  return results.flatMap(s =>
    s.split(/\s[—–]\s/).map(p => p.trim()).filter(Boolean)
  );
}

function cleanBullet(raw) {
  let b = raw.trim();
  b = b.replace(/^[-•*▪◦◆▸►▶‣⁃●>+]\s+/, '');
  b = b.replace(/^\d+[.)]\s+/, '');
  b = b.replace(
    /^(and|but|so|also|additionally|furthermore|moreover|however|therefore|thus|hence|well|yeah|yes|like|okay|ok|right|sure|basically|actually|honestly|anyway)\s+/i,
    ''
  );
  if (b.length) b = b[0].toUpperCase() + b.slice(1);
  b = b.replace(/[.,]\s*$/, '');
  return b;
}
</script>
